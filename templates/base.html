<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gear Scout{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ css_version }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <meta name="theme-color" content="#1e3a5f">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-180.png') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gear Scout">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body data-endpoint="{{ request.endpoint }}">
  <header class="topbar">
    <div class="topbar-inner">
      <a href="{{ url_for('index') }}" class="brand">🎛 Gear Scout</a>
      <form method="get" action="{{ url_for('search') }}" class="topbar-search">
        <input type="text" name="q" value="{{ request.args.get('q', '') if request.endpoint == 'search' else '' }}" placeholder="Search all sources...">
        <button type="submit" class="topbar-search-btn" aria-label="Search">&rarr;</button>
      </form>
      <nav>
        <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' else '' }}">Dashboard</a>
        <a href="{{ url_for('deals') }}" class="{{ 'active' if request.endpoint == 'deals' else '' }}">💸 Deals</a>
        <a href="{{ url_for('steals') }}" class="{{ 'active' if request.endpoint == 'steals' else '' }}">🔥 Steals</a>
        <a href="{{ url_for('favorites') }}" class="{{ 'active' if request.endpoint == 'favorites' else '' }}">Favorites</a>
        <a href="{{ url_for('lowest') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('lowest') else '' }}">Price Board</a>
        <a href="{{ url_for('fb_posts_page') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('fb_posts') else '' }}">FB Posts</a>
        <a href="{{ url_for('ask_page') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('ask') else '' }}">Ask AI</a>
        <a href="{{ url_for('telex') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('telex') else '' }}">Telex List</a>
        <a href="{{ url_for('learning_page') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('learning') else '' }}">Learning</a>
        <a href="{{ url_for('whats_new') }}" class="{{ 'active' if request.endpoint == 'whats_new' else '' }}">What's new</a>
        <a href="{{ url_for('sources') }}" class="{{ 'active' if request.endpoint in ('sources','add_source') else '' }}">Sources</a>
        <a href="{{ url_for('settings') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('settings') else '' }}">Settings</a>
        <form method="post" action="{{ url_for('logout') }}" class="logout-form">
          <button type="submit">Log out</button>
        </form>
      </nav>
    </div>
  </header>
    <div id="gs-jobs" class="gs-jobs" style="display:none;"></div>
<main class="container">
    {% block content %}{% endblock %}
  </main>

  <script>
    // Both the favorite star and the tag-save button were plain HTML forms —
    // every click did a full POST + redirect back to the same page, which
    // reloads the document from scratch and drops the scroll position back
    // to the top. Intercepting the submit and doing the same POST via
    // fetch() keeps the user right where they were.
    document.addEventListener('submit', async (e) => {
      const form = e.target;

      if (form.classList.contains('listing-fav-form')) {
        e.preventDefault();
        const data = new FormData(form);
        const willBeFavorite = data.get('favorite') === '1';
        try {
          const resp = await fetch(form.action, { method: 'POST', body: data });
          if (!resp.ok) throw new Error('bad status');
        } catch (err) {
          form.submit();
          return;
        }
        const card = form.closest('.listing-card');
        const onFavoritesPage = document.body.dataset.endpoint === 'favorites';
        if (!willBeFavorite && onFavoritesPage) {
          card.remove();
          return;
        }
        const star = form.querySelector('.fav-star');
        star.classList.toggle('is-favorite', willBeFavorite);
        star.title = willBeFavorite ? 'Remove from favorites' : 'Add to favorites';
        form.querySelector('input[name="favorite"]').value = willBeFavorite ? '0' : '1';
        return;
      }

      if (form.classList.contains('listing-telex-form')) {
        e.preventDefault();
        const btn = form.querySelector('button');
        btn.disabled = true;
        let msg = 'Couldn’t add that — try again.';
        try {
          const resp = await fetch(form.action, { method: 'POST', body: new FormData(form) });
          const data = await resp.json();
          msg = data.message || msg;
          if (data.ok) { btn.textContent = '✓'; btn.classList.add('is-added'); }
        } catch (err) { /* keep the default message */ }
        btn.disabled = false;
        gsToast(msg);
        return;
      }

      if (form.classList.contains('listing-hide-form')) {
        e.preventDefault();
        const card = form.closest('.listing-card');
        card.style.opacity = '0.3';
        try {
          const resp = await fetch(form.action, { method: 'POST', body: new FormData(form) });
          if (!resp.ok) throw new Error('bad status');
          card.remove();
        } catch (err) {
          card.style.opacity = '';
          form.submit();
        }
        return;
      }

      if (form.closest('.tag-edit')) {
        e.preventDefault();
        try {
          const resp = await fetch(form.action, { method: 'POST', body: new FormData(form) });
          if (!resp.ok) throw new Error('bad status');
        } catch (err) {
          form.submit();
          return;
        }
        const tagsInput = form.querySelector('input[name="tags"]');
        const tagsContainer = form.closest('.listing-tags');
        const details = tagsContainer.querySelector('details.tag-edit');
        tagsContainer.querySelectorAll('.tag-chip').forEach((el) => el.remove());
        tagsInput.value.split(',').map((t) => t.trim()).filter(Boolean).forEach((t) => {
          const chip = document.createElement('span');
          chip.className = 'tag-chip';
          chip.textContent = t;
          tagsContainer.insertBefore(chip, details);
        });
        details.removeAttribute('open');
      }
    });

    // Lets Chrome/Android offer "Install app". The worker only passes
    // requests through — nothing is cached, so the dashboard is never stale.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
<div id="gs-toast" class="gs-toast" role="status" aria-live="polite"></div>
<div id="ai-modal" class="ai-modal" hidden>
  <div class="ai-modal-box" role="dialog" aria-modal="true" aria-labelledby="ai-modal-title">
    <button type="button" class="ai-modal-close" aria-label="Close">✕</button>
    <h3 id="ai-modal-title">🤖 Is this a good deal?</h3>
    <div id="ai-modal-body"></div>
  </div>
</div>
<script>
  (function () {
    const modal = document.getElementById('ai-modal'), body = document.getElementById('ai-modal-body');
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    modal.addEventListener('click', (e) => { if (e.target === modal || e.target.classList.contains('ai-modal-close')) modal.hidden = true; });
    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('.ai-verdict-btn');
      if (!btn) return;
      e.preventDefault();
      modal.hidden = false;
      body.innerHTML = '<p class="muted">Reading the full ad, looking at the photo and comparing prices…</p>';
      const fd = new FormData(); fd.append('global_id', btn.dataset.gid);
      try {
        const d = await (await fetch("{{ url_for('ai_verdict') }}", {method: 'POST', body: fd})).json();
        if (!d.ok) { body.innerHTML = `<p>${esc(d.message)}</p>`; return; }
        const flags = (d.red_flags || []).map(f => `<li>${esc(f)}</li>`).join('');
        body.innerHTML = `<p class="ai-verdict ai-v-${esc((d.verdict||'').split(' ')[0].toLowerCase())}">${esc(d.verdict)}</p>
          <p>${esc(d.summary)}</p>
          ${flags ? `<p><strong>Watch out for:</strong></p><ul>${flags}</ul>` : ''}
          <p class="muted">Comp: ${esc(d.comp)}${d.looked_at_photo ? ' · looked at the photo' : ''}</p>
          ${d.fair_offer ? `<p><strong>Fair offer:</strong> $${Number(d.fair_offer).toLocaleString()}</p>` : ''}
          ${d.seller_message ? `<p><strong>Message to the seller</strong> (copy and send it yourself):</p>
            <textarea class="ai-msg" rows="4" readonly>${esc(d.seller_message)}</textarea>
            <button type="button" class="btn btn-sm ai-copy">Copy message</button>` : ''}`;
        const copy = body.querySelector('.ai-copy');
        if (copy) copy.addEventListener('click', () => {
          const ta = body.querySelector('.ai-msg'); ta.select();
          (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(
            () => gsToast('Message copied'), () => { document.execCommand('copy'); gsToast('Message copied'); });
        });
      } catch (err) { body.innerHTML = '<p>Something went wrong — try again.</p>'; }
    });
  })();
</script>
<script>
  // Collapsed sections load their listings when first opened.
  document.addEventListener('toggle', async (e) => {
    const d = e.target;
    if (!(d instanceof HTMLDetailsElement) || !d.open || !d.dataset.lazy || d.dataset.loaded) return;
    d.dataset.loaded = '1';
    const grid = d.querySelector('.listing-grid');
    grid.innerHTML = '<p class="muted">Loading…</p>';
    try { grid.innerHTML = await (await fetch(d.dataset.lazy)).text(); }
    catch (err) { grid.innerHTML = '<p class="muted">Couldn’t load — reload the page.</p>'; delete d.dataset.loaded; }
  }, true);

  function gsToast(text) {
    const t = document.getElementById('gs-toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 3500);
  }
</script>
<script>
  // Progress bar inside a status banner. `data` is a status payload:
  // {done, total, started (seconds), current_source}. With no total yet it
  // shows a moving "working" bar.
  function gsFmt(sec) {
    sec = Math.max(0, Math.round(sec));
    return sec < 60 ? `${sec}s` : `${Math.floor(sec / 60)}m ${String(sec % 60).padStart(2, '0')}s`;
  }
  window.gsProgress = function (el, text, data) {
    el.style.display = '';
    if (!el.querySelector('.gs-progress')) {
      el.innerHTML = '<div class="gs-progress-text"></div>' +
        '<div class="gs-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div class="gs-progress-fill"></div></div>' +
        '<div class="gs-progress-meta"></div>';
    }
    el.querySelector('.gs-progress-text').textContent = text;
    const bar = el.querySelector('.gs-progress'), fill = el.querySelector('.gs-progress-fill');
    const meta = el.querySelector('.gs-progress-meta');
    const started = data && data.started ? data.started * 1000 : null;
    const elapsed = started ? (Date.now() - started) / 1000 : null;
    const parts = [];
    if (data && data.total) {
      const pct = Math.min(100, Math.round(100 * data.done / data.total));
      fill.classList.remove('indeterminate');
      fill.style.width = Math.max(pct, 3) + '%';
      bar.setAttribute('aria-valuenow', pct);
      parts.push(`${pct}%`, `${data.done} of ${data.total} done`);
      if (elapsed && data.done > 0 && data.done < data.total) {
        parts.push(`about ${gsFmt(elapsed / data.done * (data.total - data.done))} left`);
      }
    } else {
      fill.classList.add('indeterminate');
      fill.style.width = '';
    }
    if (elapsed) parts.push(`${gsFmt(elapsed)} elapsed`);
    if (data && data.current_source) parts.push(`now: ${data.current_source}`);
    meta.textContent = parts.join(' · ');
  };
  // Manual scrapes and searches run on the server and keep going when you
  // switch pages; this bar shows them on every page (except where the page
  // already has its own progress bar for that job).
  (function () {
    const bar = document.getElementById('gs-jobs');
    if (!bar) return;
    const own = {scrape: 'scrape-status-banner', telex: 'telex-status', live: 'live-status-banner',
                 lowest: 'lowest-status', fbposts: 'fbposts-status'};
    let active = false;
    async function poll() {
      let data;
      try { data = await (await fetch('/jobs/active', {headers: {'X-GearScout-Test': '1'}})).json(); } catch (e) { return setTimeout(poll, 5000); }
      const jobs = (data.jobs || []).filter(j => !document.getElementById(own[j.kind]));
      if (jobs.length) {
        active = true;
        bar.style.display = '';
        bar.innerHTML = jobs.map((j, i) => `<a class="gs-job" href="${j.url}" id="gs-job-${i}"></a>`).join('');
        jobs.forEach((j, i) => gsProgress(document.getElementById(`gs-job-${i}`), `${j.label} — still running in the background`, j));
        setTimeout(poll, 2000);
      } else {
        if (active) { bar.innerHTML = '<div class="gs-job">✓ Finished — refresh to see the new listings.</div>'; setTimeout(() => { bar.style.display = 'none'; }, 8000); }
        active = false;
        setTimeout(poll, 20000);
      }
    }
    poll();
  })();
  window.gsProgressText = function (el, text) {
    el.style.display = '';
    el.textContent = text;
  };
</script>
</body>
</html>
