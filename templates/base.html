<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gear Scout{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <meta name="theme-color" content="#1e3a5f">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-180.png') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gear Scout">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body data-endpoint="{{ request.endpoint }}">
  <header class="topbar">
    <div class="topbar-inner">
      <a href="{{ url_for('index') }}" class="brand">🎛 Gear Scout</a>
      <form method="get" action="{{ url_for('search') }}" class="topbar-search">
        <input type="text" name="q" value="{{ request.args.get('q', '') if request.endpoint == 'search' else '' }}" placeholder="Search all sources...">
        <button type="submit" class="topbar-search-btn" aria-label="Search">&rarr;</button>
      </form>
      <nav>
        <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' else '' }}">Dashboard</a>
        <a href="{{ url_for('favorites') }}" class="{{ 'active' if request.endpoint == 'favorites' else '' }}">Favorites</a>
        <a href="{{ url_for('lowest') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('lowest') else '' }}">Lowest Price</a>
        <a href="{{ url_for('fb_posts_page') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('fb_posts') else '' }}">FB Posts</a>
        <a href="{{ url_for('sources') }}" class="{{ 'active' if request.endpoint in ('sources','add_source') else '' }}">Sources</a>
        <a href="{{ url_for('settings') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('settings') else '' }}">Settings</a>
        <form method="post" action="{{ url_for('logout') }}" class="logout-form">
          <button type="submit">Log out</button>
        </form>
      </nav>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script>
    // Both the favorite star and the tag-save button were plain HTML forms —
    // every click did a full POST + redirect back to the same page, which
    // reloads the document from scratch and drops the scroll position back
    // to the top. Intercepting the submit and doing the same POST via
    // fetch() keeps the user right where they were.
    document.addEventListener('submit', async (e) => {
      const form = e.target;

      if (form.classList.contains('listing-fav-form')) {
        e.preventDefault();
        const data = new FormData(form);
        const willBeFavorite = data.get('favorite') === '1';
        try {
          const resp = await fetch(form.action, { method: 'POST', body: data });
          if (!resp.ok) throw new Error('bad status');
        } catch (err) {
          form.submit();
          return;
        }
        const card = form.closest('.listing-card');
        const onFavoritesPage = document.body.dataset.endpoint === 'favorites';
        if (!willBeFavorite && onFavoritesPage) {
          card.remove();
          return;
        }
        const star = form.querySelector('.fav-star');
        star.classList.toggle('is-favorite', willBeFavorite);
        star.title = willBeFavorite ? 'Remove from favorites' : 'Add to favorites';
        form.querySelector('input[name="favorite"]').value = willBeFavorite ? '0' : '1';
        return;
      }

      if (form.classList.contains('listing-hide-form')) {
        e.preventDefault();
        const card = form.closest('.listing-card');
        card.style.opacity = '0.3';
        try {
          const resp = await fetch(form.action, { method: 'POST', body: new FormData(form) });
          if (!resp.ok) throw new Error('bad status');
          card.remove();
        } catch (err) {
          card.style.opacity = '';
          form.submit();
        }
        return;
      }

      if (form.closest('.tag-edit')) {
        e.preventDefault();
        try {
          const resp = await fetch(form.action, { method: 'POST', body: new FormData(form) });
          if (!resp.ok) throw new Error('bad status');
        } catch (err) {
          form.submit();
          return;
        }
        const tagsInput = form.querySelector('input[name="tags"]');
        const tagsContainer = form.closest('.listing-tags');
        const details = tagsContainer.querySelector('details.tag-edit');
        tagsContainer.querySelectorAll('.tag-chip').forEach((el) => el.remove());
        tagsInput.value.split(',').map((t) => t.trim()).filter(Boolean).forEach((t) => {
          const chip = document.createElement('span');
          chip.className = 'tag-chip';
          chip.textContent = t;
          tagsContainer.insertBefore(chip, details);
        });
        details.removeAttribute('open');
      }
    });

    // Lets Chrome/Android offer "Install app". The worker only passes
    // requests through — nothing is cached, so the dashboard is never stale.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
